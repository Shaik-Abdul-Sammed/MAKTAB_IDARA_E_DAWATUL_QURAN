name: Flutter Mobile App CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Analyze Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: MAKTAB/mobile_app
        run: flutter pub get

      - name: Analyze Static Code
        working-directory: MAKTAB/mobile_app
        run: flutter analyze lib/

      - name: Run Tests
        working-directory: MAKTAB/mobile_app
        run: flutter test

      - name: Configure Google Services for CI
        working-directory: MAKTAB/mobile_app
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          else
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "401274599872",
              "project_id": "maktab-management-99001",
              "storage_bucket": "maktab-management-99001.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:401274599872:android:e76418ae77ff4bb0f87025",
                  "android_client_info": {
                    "package_name": "in.dawatulquran.maktab_app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDETNoHQKvdMqLlKIEXBaqgBJPYnFsOoGA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Android Release APK
        working-directory: MAKTAB/mobile_app
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maktab-manager-release-apk
          path: MAKTAB/mobile_app/build/app/outputs/flutter-apk/app-release.apk
